<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>姐的美单 · 肤质说了算</title>
<link rel="stylesheet" href="https://miaoda.feishu.cn/fonts/css2?family=Noto+Serif+SC:wght@400;500;600;700&family=Noto+Sans+SC:wght@300;400;500;700&display=swap">
<style>
/* ============================================================
   姐的美单 · 白底高级感（苹果式克制 + 少量粉点缀）
   白底留白 · 深色文字 · 产品图主角 · CoverFlow 轮播
   ============================================================ */
:root{
  --bg:#FFFFFF;
  --bg-2:#F7F5F4;        /* 极浅暖灰 */
  --card:#FFFFFF;
  --card-2:#F5F0F1;      /* 极浅粉灰 */
  --line:rgba(47,42,44,.08);
  --line-2:rgba(47,42,44,.16);
  --ink:#2F2A2C;         /* 深灰棕 · 主文字 */
  --ink-2:rgba(47,42,44,.62);
  --ink-3:rgba(47,42,44,.4);
  --pink:#C98A9C;        /* 低饱和玫瑰粉 · 点缀 */
  --rose:#B56E85;
  --peach:#F2D3C4;       /* 淡蜜桃 */
  --green:#93B59A;       /* 低饱和绿 · 少量 */
  --shadow:0 18px 44px rgba(47,42,44,.10);
  --shadow-sm:0 8px 24px rgba(47,42,44,.06);
  --r:24px;
  --r-sm:16px;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{
  font-family:'Noto Sans SC',system-ui,-apple-system,sans-serif;
  background:var(--bg);
  color:var(--ink);
  line-height:1.7;
  font-weight:300;
  overflow-x:hidden;
  min-height:100vh;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,.serif{font-family:'Noto Serif SC',serif;font-weight:600;line-height:1.3}
a{color:inherit;text-decoration:none}
img{display:block;max-width:100%}
button{font-family:inherit;border:none;background:none;cursor:pointer;color:inherit}
input{font-family:inherit;border:none;outline:none;background:none;color:inherit}

/* ---------- 极淡氛围（几乎隐形） ---------- */
.spot{
  position:fixed;inset:0;pointer-events:none;z-index:0;
  background:
    radial-gradient(ellipse 80% 45% at 50% -10%, rgba(242,211,196,.14) 0%, transparent 60%),
    radial-gradient(ellipse 60% 30% at 90% 108%, rgba(201,138,156,.06) 0%, transparent 60%);
}

.app{position:relative;z-index:1;max-width:1240px;margin:0 auto;padding:0 24px 140px}

/* ---------- 全屏开场 ---------- */
body.splash-open{overflow:hidden}
.splash{
  position:fixed;inset:0;z-index:200;background:#fff;overflow:hidden;display:none;
  transition:opacity 1s ease .15s;
}
.splash img{width:100%;height:100%;object-fit:cover;display:block}
.splash.done{opacity:0;pointer-events:none}

/* ---------- 顶部导航 ---------- */
.topnav{
  position:sticky;top:0;z-index:50;
  backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);
  background:rgba(255,255,255,.8);
  border-bottom:1px solid var(--line);
  margin:0 -24px;padding:0 24px;
}
.nav-inner{max-width:1240px;margin:0 auto;display:flex;align-items:center;gap:28px;height:64px}
.brand{display:flex;align-items:center;gap:10px;font-family:'Noto Serif SC',serif;font-size:19px;font-weight:600;letter-spacing:.02em;color:var(--ink)}
.brand .dot{
  width:11px;height:11px;border-radius:50%;
  background:linear-gradient(135deg,var(--pink),var(--peach));
  box-shadow:0 0 10px rgba(201,138,156,.5);
}
.nav-links{display:flex;gap:6px;margin-left:auto}
.nav-links a{
  padding:8px 16px;border-radius:999px;font-size:14px;color:var(--ink-2);transition:.25s;
}
.nav-links a:hover,.nav-links a.on{background:var(--card-2);color:var(--ink)}
.back-btn{
  display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:999px;
  background:var(--card-2);font-size:13px;color:var(--ink-2);transition:.25s;border:1px solid var(--line);
}
.back-btn:hover{background:#EFE6E9;color:var(--rose)}

/* ---------- 首页 Hero ---------- */
.hero{
  position:relative;padding:96px 0 20px;text-align:center;
  min-height:auto;display:flex;flex-direction:column;align-items:center;
}
.hero .kicker{
  display:inline-flex;align-items:center;gap:8px;padding:8px 20px;border-radius:999px;
  background:var(--bg-2);border:1px solid var(--line);font-size:13px;color:var(--ink-2);
  opacity:0;
}
.hero h1{
  font-size:clamp(48px,8vw,96px);letter-spacing:.01em;margin:28px auto 10px;max-width:960px;font-weight:700;
  opacity:0;
}
.hero h1 em{
  font-style:normal;
  background:linear-gradient(120deg,var(--rose) 0%,var(--peach) 60%,var(--pink) 100%);
  -webkit-background-clip:text;background-clip:text;color:transparent;
}
.hero .lead{
  font-size:clamp(15px,2vw,19px);color:var(--ink-2);max-width:660px;margin:4px auto 36px;font-weight:300;
  opacity:0;
}
/* ---------- 肤质匹配器（首页 C 位） ---------- */
.skin-picker{max-width:880px;margin:34px auto 0;opacity:0}
.sp-label{font-size:13px;color:var(--ink-3);margin-bottom:14px;letter-spacing:.02em}
.sp-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:14px}
.sp-card{
  position:relative;text-align:left;padding:14px 14px 16px;border-radius:22px;
  background:var(--card);border:1px solid var(--line);box-shadow:var(--shadow-sm);
  transition:transform .4s cubic-bezier(.2,.8,.3,1.15),box-shadow .4s,border-color .4s;
  display:flex;flex-direction:column;gap:5px;align-items:flex-start;cursor:pointer;
}
.sp-card:hover{transform:translateY(-5px);box-shadow:0 22px 44px rgba(47,42,44,.12);border-color:rgba(201,138,156,.35)}
.sp-img{
  width:100%;aspect-ratio:1;border-radius:16px;overflow:hidden;margin-bottom:8px;
  background:linear-gradient(150deg,#FDF9F7,#F6EDEF);
}
.sp-img img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .5s}
.sp-card:hover .sp-img img{transform:scale(1.05)}
.sp-card b{font-size:16px;font-weight:600}
.sp-card small{font-size:12px;color:var(--ink-3)}
.sp-go{font-size:12px;color:var(--rose);margin-top:7px;transition:.25s}
.sp-card:hover .sp-go{color:var(--ink);transform:translateX(4px)}
.sp-hint{margin-top:14px;font-size:12px;color:var(--ink-3)}

/* 次要搜索（弱化） */
.hero-sub{
  max-width:480px;margin:40px auto 0;display:flex;align-items:center;gap:10px;
  background:var(--bg-2);border-radius:999px;padding:6px 6px 6px 20px;
  border:1px solid var(--line);opacity:0;
}
.hero-sub svg{flex:none;opacity:.45}
.hero-sub input{flex:1;font-size:14px;padding:8px 0;color:var(--ink)}
.hero-sub input::placeholder{color:var(--ink-3)}
.hero-sub button{
  background:var(--ink);color:#fff;
  padding:9px 22px;border-radius:999px;font-size:13px;font-weight:500;transition:.25s;
}
.hero-sub button:hover{background:var(--rose)}
.net-links{
  margin-top:12px;font-size:12px;color:var(--ink-3);
  display:flex;justify-content:center;gap:10px;align-items:center;flex-wrap:wrap;opacity:0;
}
body.page-in .net-links{animation:heroIn .9s .72s cubic-bezier(.2,.7,.2,1) both}
.net-links a{color:var(--rose);font-weight:400;border-bottom:1px solid rgba(181,110,133,.35);transition:.2s}
.net-links a:hover{color:var(--ink)}
.net-links .nl-dot{opacity:.5}
.hero-meta{margin-top:18px;font-size:12.5px;color:var(--ink-3);display:flex;justify-content:center;gap:8px;flex-wrap:wrap;opacity:0}

/* 开场结束后主页内容依次浮现 */
body.page-in .hero .kicker{animation:heroIn .9s .05s cubic-bezier(.2,.7,.2,1) both}
body.page-in .hero h1{animation:heroIn .9s .18s cubic-bezier(.2,.7,.2,1) both}
body.page-in .hero .lead{animation:heroIn .9s .32s cubic-bezier(.2,.7,.2,1) both}
body.page-in .skin-picker{animation:heroIn .9s .46s cubic-bezier(.2,.7,.2,1) both}
body.page-in .hero-sub{animation:heroIn .9s .6s cubic-bezier(.2,.7,.2,1) both}
body.page-in .hero-meta{animation:heroIn .9s .85s cubic-bezier(.2,.7,.2,1) both}

/* ---------- 开场视觉（已移除图框，接入视频开场） ---------- */

@keyframes heroIn{
  from{opacity:0;transform:translateY(24px)}
  to{opacity:1;transform:translateY(0)}
}

/* ============================================================
   CoverFlow 产品轮播（苹果发布会式交叠滑动）
   ============================================================ */
.carousel-wrap{position:relative;width:100%;margin:56px auto 0;animation:heroIn 1.2s .85s both}
.carousel{position:relative;height:clamp(260px,34vw,400px);overflow:hidden;touch-action:pan-y}
.car-track{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
.car-item{
  position:absolute;left:50%;top:50%;
  width:clamp(140px,18vw,210px);
  margin-left:calc(clamp(140px,18vw,210px)/-2);
  margin-top:calc(clamp(140px,18vw,210px)/-2);
  border-radius:20px;overflow:hidden;
  background:linear-gradient(160deg,#FDF9F7,#F6EDEF);
  box-shadow:var(--shadow);
  transition:transform .8s cubic-bezier(.3,.75,.25,1),opacity .8s ease,box-shadow .8s ease;
  cursor:pointer;
  will-change:transform;
}
.car-item img{width:100%;height:100%;object-fit:cover;pointer-events:none}
.car-item.active{box-shadow:0 24px 60px rgba(47,42,44,.18)}
.car-item .cap{
  position:absolute;left:0;right:0;bottom:0;padding:14px 14px 12px;
  background:linear-gradient(transparent,rgba(255,255,255,.92));
  text-align:left;
}
.car-item .cap b{display:block;font-size:13.5px;font-weight:500;color:var(--ink);line-height:1.4}
.car-item .cap span{font-size:11px;color:var(--ink-3)}
.car-dots{display:flex;justify-content:center;gap:8px;margin-top:18px}
.car-dots i{width:6px;height:6px;border-radius:3px;background:rgba(47,42,44,.16);transition:.4s}
.car-dots i.on{width:22px;background:var(--rose)}

/* ---------- 滚动浮现 ---------- */
.reveal{opacity:0;transform:translateY(28px);transition:opacity .9s cubic-bezier(.2,.7,.2,1),transform .9s cubic-bezier(.2,.7,.2,1)}
.reveal.in{opacity:1;transform:translateY(0)}
.reveal-d1{transition-delay:.08s}
.reveal-d2{transition-delay:.16s}
.reveal-d3{transition-delay:.24s}

/* ---------- 入口卡片（带图） ---------- */
.entries{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin:64px 0 20px}
.entry{
  background:var(--card);border-radius:var(--r);overflow:hidden;position:relative;
  border:1px solid var(--line);box-shadow:var(--shadow-sm);
  transition:transform .45s cubic-bezier(.2,.8,.3,1.2),box-shadow .45s,border-color .45s;
}
.entry:hover{transform:translateY(-6px);box-shadow:var(--shadow);border-color:rgba(201,138,156,.35)}
.entry .e-img{position:relative;height:150px;overflow:hidden;background:linear-gradient(160deg,#FDF9F7,#F6EDEF)}
.entry .e-img .imgs{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
.entry .e-img img{height:80%;width:auto;object-fit:contain;transition:transform .5s cubic-bezier(.2,.8,.3,1.2)}
.entry:hover .e-img img{transform:scale(1.07) translateY(-2px)}
/* 头像墙 */
.avatar-wall{display:flex;align-items:center;justify-content:center;gap:-14px}
.avatar-wall .aw{
  width:52px;height:52px;border-radius:50%;margin-left:-12px;
  display:flex;align-items:center;justify-content:center;
  font-family:'Noto Serif SC',serif;font-size:18px;font-weight:600;color:#fff;
  border:3px solid #fff;box-shadow:0 4px 12px rgba(47,42,44,.14);
}
.avatar-wall .aw:first-child{margin-left:0}
.aw1{background:linear-gradient(140deg,#A8C8D4,#8FB6C6)}
.aw2{background:linear-gradient(140deg,#F2A6B5,#E98FA3)}
.aw3{background:linear-gradient(140deg,#B9CDA8,#94B08A)}
.aw4{background:linear-gradient(140deg,#F2C894,#E5A86B)}
/* 数据图形 */
.e-viz{width:120px;height:120px;position:relative}
.e-viz .ring{position:absolute;inset:0;border-radius:50%;border:14px solid #F3E3E7;border-top-color:var(--pink);transform:rotate(20deg);transition:.5s}
.e-viz .ring.r2{inset:18px;border-width:10px;border-color:#EDEDEA;border-top-color:#C9D3C6;transform:rotate(140deg)}
.e-viz .num{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:'Noto Serif SC',serif;font-size:26px;font-weight:600;color:var(--rose)}
.e-body{padding:18px 22px 22px}
.e-body h3{font-size:18px;margin-bottom:5px;display:flex;align-items:center;justify-content:space-between}
.e-body p{font-size:12.5px;color:var(--ink-2);line-height:1.6}
.e-body .arrow{color:var(--ink-3);font-size:16px;transition:.3s}
.entry:hover .arrow{transform:translateX(4px);color:var(--rose)}

/* ---------- 通用页面头 ---------- */
.page-head{padding:56px 0 8px}
.crumbs{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--ink-3);margin-bottom:26px;flex-wrap:wrap}
.crumbs a{color:var(--ink-2)}
.crumbs a:hover{color:var(--rose)}
.crumbs .sep{opacity:.5}
.crumbs .cur{color:var(--rose)}
.page-head h2{font-size:clamp(32px,5vw,52px);margin-bottom:12px;color:var(--ink)}
.page-head .sub{color:var(--ink-2);font-size:15px;max-width:680px}

/* ---------- 区块标题 ---------- */
.sec-head{display:flex;align-items:flex-end;justify-content:space-between;margin:52px 0 20px}
.sec-head h3{font-size:24px;color:var(--ink)}
.sec-head .more{font-size:13px;color:var(--ink-3)}
.sec-head .more:hover{color:var(--rose)}

/* ---------- 达人网格 ---------- */
.creator-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
.creator-card{
  background:var(--card);border-radius:var(--r);padding:26px 22px;
  border:1px solid var(--line);position:relative;
  box-shadow:var(--shadow-sm);
  transition:transform .45s cubic-bezier(.2,.8,.3,1.2),box-shadow .45s,border-color .45s;
}
.creator-card:hover{transform:translateY(-5px);box-shadow:var(--shadow);border-color:rgba(201,138,156,.35)}
.avatar-wrap{display:flex;align-items:center;gap:14px;margin-bottom:14px}
.avatar{
  width:54px;height:54px;border-radius:50%;flex:none;
  display:flex;align-items:center;justify-content:center;
  font-family:'Noto Serif SC',serif;font-size:20px;font-weight:600;color:#fff;
  background:linear-gradient(140deg,var(--pink),var(--peach));
  box-shadow:0 6px 16px rgba(201,138,156,.3);
}
.avatar.pink{background:linear-gradient(140deg,#F2A6B5,#E98FA3);color:#fff}
.avatar.teal{background:linear-gradient(140deg,#A8C8D4,#8FB6C6);color:#fff}
.avatar.amber{background:linear-gradient(140deg,#F2C894,#E5A86B);color:#fff}
.avatar.sage{background:linear-gradient(140deg,#B9CDA8,#94B08A);color:#fff}
.cname{font-size:16.5px;font-weight:500}
.crole{font-size:12px;color:var(--ink-3);margin-top:2px}
.cdesc{font-size:13px;color:var(--ink-2);line-height:1.65;margin-bottom:12px;min-height:44px}
.cmeta{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.tag{
  display:inline-block;padding:4px 12px;border-radius:999px;font-size:11.5px;
  background:var(--bg-2);color:var(--ink-2);border:1px solid var(--line);
}
.tag.head{background:#F6EAEE;color:var(--rose);border-color:rgba(201,138,156,.3)}
.tag.green{background:#EFF4EF;color:#5E8A66;border-color:rgba(147,181,154,.35)}
.cfans{font-size:12px;color:var(--ink-3)}
.badge-head{
  position:absolute;top:18px;right:18px;font-size:10.5px;letter-spacing:.06em;
  padding:3px 10px;border-radius:999px;background:#F6EAEE;color:var(--rose);
  border:1px solid rgba(201,138,156,.3);
}

/* ---------- 达人详情 ---------- */
.creator-detail{display:grid;grid-template-columns:320px 1fr;gap:36px;margin-top:26px;align-items:start}
.cd-side{
  background:var(--card);border-radius:var(--r);padding:34px 28px;
  border:1px solid var(--line);box-shadow:var(--shadow-sm);position:sticky;top:88px;
}
.cd-avatar{width:88px;height:88px;border-radius:50%;font-size:34px;margin-bottom:18px}
.cd-side h3{font-size:24px;margin-bottom:4px;color:var(--ink)}
.cd-side .role{font-size:13px;color:var(--ink-3);margin-bottom:16px}
.cd-fans{display:flex;gap:22px;padding:14px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line);margin-bottom:16px}
.cd-fans b{display:block;font-family:'Noto Serif SC',serif;font-size:20px;font-weight:600;color:var(--rose)}
.cd-fans span{font-size:11.5px;color:var(--ink-3)}
.cd-side .bio{font-size:13.5px;color:var(--ink-2);line-height:1.75;margin-bottom:18px}
.btn-dy{
  display:flex;align-items:center;justify-content:center;gap:8px;width:100%;
  background:var(--ink);color:#fff;
  padding:13px;border-radius:14px;font-size:14px;font-weight:500;transition:.25s;
}
.btn-dy:hover{background:var(--rose)}
.cd-main{min-width:0}
.verdict{
  background:var(--card);border-radius:var(--r);padding:26px 28px;margin-bottom:22px;
  border:1px solid var(--line);box-shadow:var(--shadow-sm);
}
.verdict h4{font-size:16px;margin-bottom:12px;display:flex;align-items:center;gap:8px;color:var(--ink)}
.verdict h4::before{content:'';width:8px;height:8px;border-radius:50%;background:var(--pink);box-shadow:0 0 10px var(--pink)}
.v-good,.v-bad{font-size:13.5px;line-height:1.75;padding:12px 16px;border-radius:14px;margin-bottom:10px}
.v-good{background:#EFF4EF;color:#4E7A54}
.v-good::before{content:'口碑 · ';font-weight:500}
.v-bad{background:#F6EAEE;color:#A85A70}
.v-bad::before{content:'争议 · ';font-weight:500}

/* ---------- 产品卡 ---------- */
.prod-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.prod-card{
  display:block;text-decoration:none;color:inherit;
  background:var(--card);border-radius:var(--r);padding:22px;position:relative;
  border:1px solid var(--line);box-shadow:var(--shadow-sm);
  transition:transform .45s cubic-bezier(.2,.8,.3,1.2),box-shadow .45s,border-color .45s;
}
.prod-card:hover{transform:translateY(-5px);box-shadow:var(--shadow);border-color:rgba(201,138,156,.35)}
.prod-img{
  aspect-ratio:1;border-radius:var(--r-sm);overflow:hidden;margin-bottom:16px;position:relative;
  background:linear-gradient(150deg,#FDF9F7,#F6EDEF);
  display:flex;align-items:center;justify-content:center;
}
.prod-img img{width:72%;height:72%;object-fit:contain;transition:transform .5s cubic-bezier(.2,.8,.3,1.2)}
.prod-card:hover .prod-img img{transform:scale(1.08)}
.prod-img .noimg{font-size:12px;color:var(--ink-3);text-align:center;padding:0 10px;line-height:1.6}
.hot-badge{position:absolute;top:10px;right:10px;left:auto;background:rgba(255,255,255,.93);border:1px solid rgba(192,98,78,.18);color:#C0624E;font-size:10.5px;padding:5px 10px;border-radius:999px;z-index:2;line-height:1.45;font-weight:600;max-width:80%;text-align:right;box-shadow:0 2px 8px rgba(47,42,44,.06)}
.prod-name{font-size:15px;font-weight:500;margin-bottom:2px}
.prod-brand{font-size:12px;color:var(--ink-3);margin-bottom:8px}
.prod-price{font-size:14.5px;color:var(--rose);font-weight:500;margin-bottom:10px}
.prod-stars{display:flex;align-items:center;gap:6px;font-size:12px;line-height:1;margin-bottom:8px}
.prod-stars .stars{color:#E8A33D;letter-spacing:2px;font-size:12px}
.prod-stars .stars-score{color:var(--ink-3);font-size:11px}
.pd-stars{margin:6px 0 10px;display:flex;align-items:center;gap:6px}
.pd-stars .stars{color:#E8A33D;font-size:16px;letter-spacing:2px}
.pd-stars .stars-score{color:var(--ink-3);font-size:12px}
.prod-note{font-size:12.5px;color:var(--ink-2);line-height:1.6;margin-bottom:10px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.prod-tags{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.pfor,.pnot{font-size:11px;padding:3px 10px;border-radius:999px}
.pfor{background:#EFF4EF;color:#4E7A54}
.pnot{background:#F6EAEE;color:#A85A70}
.pfrom{font-size:11px;color:var(--ink-3);display:flex;align-items:center;gap:6px}
.pfrom .rec{color:var(--rose);font-weight:500}

/* ---------- 榜单 ---------- */

}

/* ---------- 方法页 ---------- */
.formula-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin:28px 0}

  background:linear-gradient(135deg,#FAF1F3,rgba(242,211,196,.16));

.roadmap{

}

.phase{display:flex;gap:16px;margin-bottom:18px}

.phase .state{font-size:11px;color:var(--rose);margin-left:6px;border:1px solid rgba(201,138,156,.35);padding:1px 8px;border-radius:999px;vertical-align:1px}

.foot-stats{

  display:flex;justify-content:center;gap:40px;flex-wrap:wrap;
}

.tabbar{

}

}
.dir-filter button.on{background:var(--ink);color:#fff;border-color:transparent;font-weight:500}

/* 滚动浮现 */
let io = null;
function bindReveal(){
  if(!('IntersectionObserver' in window)){ document.querySelectorAll('.reveal').forEach(e=>e.classList.add('in')); return; }
  if(io) io.disconnect();
  io = new IntersectionObserver(es=>{
    es.forEach(e=>{ if(e.isIntersecting){ e.target.classList.add('in'); io.unobserve(e.target); } });
  },
  {threshold:.08, rootMargin:'0px 0px -40px 0px'});
  document.querySelectorAll('.reveal:not(.in)').forEach(e=>io.observe(e));
}

/* 全屏开场：清晰产品图停留片刻 → 自然淡出 → 主页文字弹出（仅首次加载播放） */
function playSplashIfNeeded(){
  const s = document.getElementById('splash');
  if(!s) return;
  const force = location.search.indexOf('splash') > -1;
  if(!force && sessionStorage.getItem('jdm-splash') === '1'){
    s.style.display = 'none';
    document.body.classList.add('page-in');
    return;
  }
  document.body.classList.add('splash-open');
  s.style.display = 'block';
  setTimeout(()=>{
    s.classList.add('done');                              /* 停留 1.8s 后淡出 */
    document.body.classList.remove('splash-open');
    document.body.classList.add('page-in');              /* 主页文字依次弹出 */
    sessionStorage.setItem('jdm-splash','1');
  }, 1800);
  setTimeout(()=>{ s.style.display = 'none'; }, 3200);
}

/* ============================================================
   CoverFlow 轮播
   ============================================================ */
let carTimer = null;
let carCurrent = 0;
function layoutCarousel(){
  const items = document.querySelectorAll('.car-item');
  if(!items.length) return;
  const n = items.length;
  items.forEach((el,i)=>{
    let d = i - carCurrent;
    if(d > n/2) d -= n;
    if(d < -n/2) d += n;
    const abs = Math.abs(d);
    const scale = abs===0 ? 1.06 : abs===1 ? .8 : .58;
    const op = abs===0 ? 1 : abs===1 ? .72 : .38;
    const tx = d * 76;
    const ty = abs===0 ? 0 : abs*6;
    el.style.transform = `translate(${tx}%, ${ty}%) scale(${scale})`;
    el.style.opacity = op;
    el.style.zIndex = abs===0 ? 10 : 10-abs;
    el.classList.toggle('active', abs===0);
    el.querySelector('.cap').style.opacity = abs===0 ? 1 : 0;
  });
  const dots = document.querySelectorAll('.car-dots i');
  dots.forEach((d,i)=>d.classList.toggle('on', i===carCurrent));
}
function carNext(){ carCurrent = (carCurrent+1) % document.querySelectorAll('.car-item').length; layoutCarousel(); }
function startCarousel(){
  stopCarousel();
  carTimer = setInterval(carNext, 2600);
}
function stopCarousel(){ if(carTimer){ clearInterval(carTimer); carTimer=null; } }
function bindCarousel(){
  const items = document.querySelectorAll('.car-item');
  if(!items.length) return;
  items.forEach((el,i)=>{
    el.addEventListener('click',()=>{

  }, {passive:true});
  layoutCarousel();
  startCarousel();
}

    <div class="fx">综合分 = 独立博主推荐次数 × 40% + 公开笔记口碑指数 × 40% + 价格亲民度 × 20%</div>
    <div style="font-size:12.5px;color:var(--ink-3);text-align:center;margin-top:10px">每项 0–100 分，加权求和。分数越高排名越前，TOP 10 上榜。</div>
  </div>

  <div class="formula-grid">
    <div class="formula-card reveal"><div class="pct">40%</div><h4>独立博主推荐次数</h4><p>收录博主在公开内容中明确推荐的次数。多位无关联博主独立推荐同一产品，可信度更高；同一博主多次推荐只计一次。</p></div>
    <div class="formula-card reveal reveal-d1"><div class="pct">40%</div><h4>公开笔记口碑指数</h4><p>综合公开平台的用户笔记、评论区反馈与复购评价（好评/差评比例、真实使用反馈）。只采公开可查内容，不做任何美化。</p></div>
    <div class="formula-card reveal reveal-d2"><div class="pct">20%</div><h4>价格亲民度</h4><p>参考价与同类产品均价的比较，越亲民得分越高。价格仅作参考，以各官方旗舰店实时价格为准。</p></div>
  </div>

  <div class="pledge reveal">
    <h4>中立性承诺</h4>
    <p>本站不接受品牌付费推荐，不收取任何"推荐费"。所有榜单仅基于公开博主推荐与公开口碑聚合计算。收录博主与产品均标注来源，任何一条数据你都可以回源验证。若发现商业关系影响榜单，欢迎指正，我们立即修正。</p>
  </div>

  <div class="sources">
    <div class="sec-head"><h3>数据来源与口径</h3></div>
    <div class="source-item reveal"><b>博主内容</b><span>抖音、小红书等平台公开的博主测评/推荐内容，只收录近 12 个月（2025.09–2026.09）内博主主动公开的推荐，不采直播间话术。每款产品详情页的「▶」按钮直达博主公开发布的视频原页，任何一条都可以回源点开核对。</span></div>
    <div class="source-item reveal"><b>口碑数据</b><span>公开平台的用户笔记、评论区反馈与复购评价，按好评/差比与反馈质量加权。</span></div>
    <div class="source-item reveal"><b>参考价格</b><span>各品牌官方旗舰店公开价格，标注规格；价格变动以官方为准。</span></div>
    <div class="source-item reveal"><b>时效说明</b><span>产品每年迭代，榜单只收录近一年内仍在售/仍被推荐的版本；被官方定性的问题产品（如 CSS 油橄榄精华）会标注「雷品」、写明定性结论，且不提供任何购买入口。</span></div>
    <div class="source-item reveal"><b>更新机制</b><span>人工定期核对整理，页面标注更新日期。现阶段不做自动爬取，确保每条数据有人核对、可追溯；「联网自动同步博主动态」在路线图第 3 阶段，升级架构后实现。</span></div>
  </div>

  <div class="roadmap reveal">
    <h4>产品路线图</h4>
    <div class="phase">
      <div class="pno">1</div>
      <div><h5>聚合与榜单（当前版本）<span class="state">已上线</span></h5><p>收录博主、产品档案、12 张肤质×品类榜单、公式公开。先做好「可信」，再谈规模。</p></div>
    </div>
    <div class="phase">
      <div class="pno">2</div>
      <div><h5>搜索与更多榜单</h5><p>开放全站搜索（产品/品牌/博主），扩展更多肤质组合与品类（洗护、彩妆单品）。</p></div>
    </div>
    <div class="phase">
      <div class="pno off">3</div>
      <div><h5>自动同步博主动态（二期规划）<span class="state">规划中</span></h5><p>升级全栈架构，定时抓取并同步博主最新推荐，配套数据审核机制。届时「更新日期」将自动刷新。</p></div>
    </div>
  </div>`;
  bindReveal();
}

/* ---------- 路由 ---------- */
function router(){
  stopCarousel();
  const h = location.hash || '#/home';
  const [path, query] = h.slice(1).split('?');
  const params = new URLSearchParams(query||'');
  window.scrollTo(0,0);
  const tab = document.querySelectorAll('.tabbar button');
  tab.forEach(t=>t.classList.remove('on'));
  if(path.startsWith('/home')){ tab[0].classList.add('on'); viewHome(); }
  else if(path.startsWith('/products')){ viewProducts(); }
  else if(path.startsWith('/product')){ viewProduct(params.get('id')); }
  else if(path.startsWith('/creators')){ tab[1].classList.add('on'); viewCreators(); }
  else if(path.startsWith('/creator')){ tab[1].classList.add('on'); viewCreator(params.get('id')); }
  else if(path.startsWith('/rankings')){ tab[2].classList.add('on'); viewRankings(); }
  else if(path.startsWith('/method')){ tab[3].classList.add('on'); viewMethod(); }
  else viewHome();
}
window.addEventListener('hashchange', router);
document.querySelectorAll('.tabbar button').forEach(b=>b.addEventListener('click',()=>{
  window.location.hash = '#/'+b.dataset.tab;
}));
router();
document.body.classList.add('page-in');   /* 无开场图：直接触发首页文字/肤质卡入场动画 */
</script>
</body>
